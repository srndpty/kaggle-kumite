name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # competitions/ の型検査に ML ライブラリが要るため、既定グループ（dev + tabular）を入れる。
      - run: uv sync --locked
      - run: pwsh ./dev.ps1 check
        env:
          UV_NO_SYNC: "1"
