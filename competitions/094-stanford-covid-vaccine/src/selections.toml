# 選定計画。比較実験の前に固定し、変更するときは理由を README に書いて別の計画名にする。
# candidates は優先順（構成の単純な順）。tolerance は MCRMSE の実質同点の許容差で、
# P3 の seed 違い（E00 0.00039、E01 0.00162）の最大を上回る 0.002 とした。

[p3-baseline]
candidates = ["E00", "E01"]
tolerance = 0.002

# P7 の最終選定。現行コードで export できる候補（コード一般化後の run）に限る。
# 規則は P3 で固定したもの（許容差 0.002、構成の単純な順）。E07 を実行した後に書いた計画である点は README に記録する。
[final]
candidates = ["E06-r2", "E07"]
tolerance = 0.002
