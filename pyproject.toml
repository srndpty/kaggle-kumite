[project]
name = "kumite"
version = "0.1.0"
description = "Kaggle 100本ノックの共通ライブラリ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "nbstripout",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
    "types-psutil>=7.2.2.20261111",
]
tabular = [
    "catboost",
    "ipykernel",
    "lightgbm",
    "matplotlib",
    "numpy",
    "pandas",
    "pandas-stubs",
    "polars",
    "scikit-learn",
    "xgboost",
]
vision = [
    "pillow",
    "timm",
    "torch",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kumite"]

[tool.uv]
# competitions/ も型検査するため、CI も既定グループ（dev + tabular + vision）を入れる。
default-groups = ["dev", "tabular", "vision"]

# torch は Windows（学習用の GPU 環境）では CUDA 版、Linux（CI）では CPU 版を入れる。
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
# 行長は formatter に任せる（全角文字は幅2で数えられ、日本語メッセージで誤検知するため）。
# RUF001-003: 日本語の全角記号を「紛らわしい文字」と判定させない。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "competitions"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# コンペ用スクリプトは ML ライブラリ（型情報が不完全）を多用するため、
# 「型が不明」系の strict ルールだけ切る。型の食い違いなど本物のエラーは検出する。
[[tool.pyright.executionEnvironments]]
root = "competitions"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "."

[tool.pytest.ini_options]
# コンペ固有コードのテスト（competitions/*/src/test_*.py）は、コンペ間でモジュール名（dataset など）が
# ぶつかるので、`dev test` がコンペごとに別プロセスで実行する。素の pytest は tests/ だけを見る
testpaths = ["tests"]
